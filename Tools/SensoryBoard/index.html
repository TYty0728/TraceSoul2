<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceSoul 感官终端</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#ecf3fa;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:24px}h1{font-size:28px;margin:0}p{color:#a8bacd}.grid{display:grid;grid-template-columns:1fr 320px;gap:32px;margin-top:24px}.card{background:#1b293b;border:1px solid #33455a;border-radius:16px;padding:22px;margin-bottom:18px}textarea{width:100%;height:150px;padding:12px;border:1px solid #526277;border-radius:8px;background:#101824;color:inherit;font:inherit}button{background:#83e2c8;color:#102620;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.45}input{max-width:100%}#preview{width:320px;height:480px;border:1px solid #496274;border-radius:12px;object-fit:contain;background:#080e16}#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}small{color:#a8bacd}@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin:8px auto}.screen{margin:auto}}
</style>
<main><h1>TraceSoul · 感官终端</h1><p>通过 USB 发送文字、图片和短音频。完成状态来自开发板的执行回执。</p>
<button id="connect">检查连接</button><span id="busy" role="status" aria-live="polite"></span>
<div class="grid"><section>
<div class="card"><label for="text">屏幕文字</label><textarea id="text" maxlength="500">你好！
我是 TraceSoul。

屏幕已经连接。
你可以从电脑给我发送文字和图片。</textarea><button id="sendText">发送到屏幕</button></div>
<div class="card"><label for="picture">图片</label><p><input id="picture" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></p><button id="sendImage">显示图片</button></div>
<div class="card"><label for="audio">声音</label><p><input id="audio" type="file" accept=".wav,audio/wav"></p><small>16 位 PCM WAV，最长 10 秒；支持单声道或双声道。</small><br><button id="sendAudio">播放音频</button> <button id="chime">播放测试音</button></div>
</section><section class="screen"><img id="preview" alt="发送成功后显示画面预览"><p><small>这里是电脑生成的预览，不是屏幕拍摄画面。</small></p><div id="status" role="status" aria-live="polite">尚未检查开发板连接。</div></section></div></main>
<script>
const $=id=>document.getElementById(id);
async function send(path,body){
 document.querySelectorAll('button').forEach(b=>b.disabled=true);$('busy').textContent=' 正在发送并等待开发板回执…';
 try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'发送失败');
 const x=data.receipt;$('status').textContent=`${x.status==='done'?'开发板已执行完成':'开发板已连接'}\n画面累计：${x.frames} 次\n音频累计：${x.plays} 次\n本次编号：${x.id}`;if(data.preview)$('preview').src='data:image/png;base64,'+data.preview;
 }catch(e){$('status').textContent='未确认完成：'+e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);$('busy').textContent='';}
}
async function file(id,op){const f=$(id).files[0];if(!f){$('status').textContent='请先选择文件';return;}if(f.size>4*1024*1024){$('status').textContent='文件不能超过 4 MB';return;}
 const reader=new FileReader();reader.onload=()=>send(op,{data:reader.result.split(',')[1]});reader.readAsDataURL(f);}
$('connect').onclick=()=>send('status',{});$('sendText').onclick=()=>send('text',{text:$('text').value});$('sendImage').onclick=()=>file('picture','image');$('sendAudio').onclick=()=>file('audio','audio');$('chime').onclick=()=>send('chime',{});
</script></html>
