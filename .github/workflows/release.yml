name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish"
        required: true

permissions:
  contents: write

jobs:
  update-integration:
    uses: ./.github/workflows/update-check.yml
  release:
    needs: update-integration
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must be vMAJOR.MINOR.PATCH: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore TraceSoul2.sln
          dotnet build TraceSoul2.sln -c Release --no-restore
          dotnet Tools/CoreCheck/bin/Release/net8.0/CoreCheck.dll
          dotnet Tools/Updater/bin/Release/net8.0/TraceSoul2.Updater.dll --self-test
          dotnet Tools/UpdateCheck/bin/Release/net8.0/UpdateCheck.dll
          python -m unittest discover -s scripts/tests -p test_update_server.py
          node scripts/tests/test-update-ui.cjs
          dotnet Tools/ChatCheck/bin/Release/net8.0/ChatCheck.dll
          dotnet Tools/ChatCheck/bin/Release/net8.0/ChatCheck.dll --prompt-layout

      - name: Build signed-by-hash release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh scripts/Publish-Release.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}' -Runtime win-x64
          pwsh scripts/Publish-Release.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}' -Runtime linux-x64
          pwsh scripts/Publish-Release.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}' -Runtime linux-arm64

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $assets = @(Get-ChildItem -LiteralPath "artifacts/$version" -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -lt 2) { throw 'Release assets are missing.' }
          gh release create $tag @assets --verify-tag --generate-notes --title "TraceSoul2 $tag"
