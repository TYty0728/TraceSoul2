name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish"
        required: true

permissions:
  contents: write

jobs:
  update-integration:
    uses: ./.github/workflows/update-check.yml
  release:
    needs: update-integration
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must be vMAJOR.MINOR.PATCH: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore TraceSoul2.sln
          dotnet build TraceSoul2.sln -c Release --no-restore
          dotnet exec --runtimeconfig Tools/Host/bin/Release/net8.0/TraceSoul2.Host.runtimeconfig.json Tools/ChatCheck/bin/Release/net8.0/ChatCheck.dll --startup-overview-host Tools/Host/bin/Release/net8.0/TraceSoul2.Host.dll
          dotnet Tools/CoreCheck/bin/Release/net8.0/CoreCheck.dll
          dotnet Tools/Updater/bin/Release/net8.0/TraceSoul2.Updater.dll --self-test
          dotnet Tools/UpdateCheck/bin/Release/net8.0/UpdateCheck.dll
          python -m unittest discover -s scripts/tests -p test_update_server.py
          python -m unittest discover -s scripts/tests -p test_publish_privacy.py
          python -m unittest discover -s scripts/tests -p test_incremental.py
          python scripts/tests/test-identity-reorganization-host.py
          python scripts/tests/test-main-fallback-host.py
          python scripts/tests/test-backups-host.py Tools/Host/bin/Release/net8.0/TraceSoul2.Host.dll
          node scripts/tests/test-update-ui.cjs
          node scripts/tests/test-daily-build-ui.cjs
          node scripts/tests/test-provider-slots-ui.cjs
          node scripts/tests/test-runtime-ui.cjs
          dotnet Tools/ChatCheck/bin/Release/net8.0/ChatCheck.dll
          dotnet Tools/ChatCheck/bin/Release/net8.0/ChatCheck.dll --prompt-layout
          dotnet Tools/ChatCheck/bin/Release/net8.0/ChatCheck.dll --cognition-migration Tools/Migration/bin/Release/net8.0/TraceSoul2.Migrate.dll
          Get-ChildItem scripts/tests -Filter '*.cjs' | Sort-Object Name | ForEach-Object { node $_.FullName }
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'Pillow>=11,<13' 'soundfile>=0.13,<1' 'cryptography>=44,<50' pyserial==3.5 numpy==2.2.6
          python -m unittest discover -s Tools/DecisionRelay -p 'test_*.py'
          python -m unittest discover -s Tools/CodexBridge -p 'test_*.py'
          python -m unittest discover -s Tools/LocalVoice -p 'test_*.py'
          python -m unittest discover -s Tools/SensoryBoard -p 'test_*.py'
          python -m unittest discover -s scripts/tests -p 'test_call_voice_filter.py'

      - name: Build signed-by-hash release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/fetch_incremental_base.py --repository '${{ github.repository }}' --output artifacts/incremental-base
          pwsh scripts/Publish-Release.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}' -Runtime win-x64 -BaseManifestDirectory artifacts/incremental-base
          pwsh scripts/Publish-Release.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}' -Runtime linux-x64 -BaseManifestDirectory artifacts/incremental-base
          pwsh scripts/Publish-Release.ps1 -ExpectedVersion '${{ steps.version.outputs.version }}' -Runtime linux-arm64 -BaseManifestDirectory artifacts/incremental-base

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $assets = @(Get-ChildItem -LiteralPath "artifacts/$version" -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -lt 2) { throw 'Release assets are missing.' }
          gh release create $tag @assets --verify-tag --generate-notes --title "TraceSoul2 $tag"
